name: Update Pre-commit Status
on:
  workflow_run:
    workflows: ["pre-commit"]
    types:
      - completed

jobs:
  update_status:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Update pre-commit status
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = "${{ github.event.workflow_run.head_sha }}";
            const conclusion = "${{ github.event.workflow_run.conclusion }}";
            const checkName = "pre-commit / pre-commit (pull_request)";

            // Buscar el check existente
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });

            const existingCheck = checks.data.check_runs.find(c => c.name === checkName);

            if (existingCheck) {
              // Si ya existe, lo actualizamos
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: existingCheck.id,
                status: "completed",
                conclusion: conclusion,
                details_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}",
                output: {
                  title: "Pre-commit Check",
                  summary: `Estado final: **${conclusion}**`,
                  text: "Detalles en el enlace de ejecución."
                }
              });
            }
